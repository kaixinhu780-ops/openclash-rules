# Public subconverter base for test1-merged-groups.ini. No nodes or subscriptions.
# OpenClash custom DNS can override this; verify the generated configuration.
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: true
mode: rule
log-level: info
ipv6: false
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  prefer-h3: false
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  nameserver:
    - 'https://1.1.1.1/dns-query#🚀 手动选择'
    - 'https://8.8.8.8/dns-query#🚀 手动选择'
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    '+.browserleaks.com': ['https://1.1.1.1/dns-query#🚀 手动选择', 'https://8.8.8.8/dns-query#🚀 手动选择']
    '+.browserleaks.org': ['https://1.1.1.1/dns-query#🚀 手动选择', 'https://8.8.8.8/dns-query#🚀 手动选择']
    '+.browserleaks.net': ['https://1.1.1.1/dns-query#🚀 手动选择', 'https://8.8.8.8/dns-query#🚀 手动选择']
    '+.dnsleaktest.com': ['https://1.1.1.1/dns-query#🚀 手动选择', 'https://8.8.8.8/dns-query#🚀 手动选择']
    '+.ipleak.net': ['https://1.1.1.1/dns-query#🚀 手动选择', 'https://8.8.8.8/dns-query#🚀 手动选择']
  fake-ip-filter:
    - '*.lan'
    - '*.local'
