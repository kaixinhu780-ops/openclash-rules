# OpenClash 基础 DNS 与嗅探配置 (彻底杜绝 DNS 泄漏专用版)
# 搭配 subconverter INI 规则模板使用

mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# ============================================================
# DNS 模块 (零泄漏核心：默认 nameserver 强制走代理组解析)
# ============================================================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: false

  # 引导解析 DNS（纯 IP，仅用于直连解析代理节点服务器与 DoH 的域名，防死锁）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1

  # 代理节点服务器域名专用解析（直连）
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT

  # 国内直连流量专用 DNS（仅用于被规则判定为 DIRECT 的国内流量，直连低延迟）
  direct-nameserver:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver-follow-policy: false

  # 核心防漏：默认 nameserver 全部强制通过代理节点（👆 手动选择）在远端查询
  # 严禁在此处加入任何国内未加密 DNS 或国内 DoH，避免并发导致 DNS 泄漏！
  nameserver:
    - https://1.1.1.1/dns-query#👆 手动选择
    - https://8.8.8.8/dns-query#👆 手动选择
    - https://doh.opendns.com/dns-query#👆 手动选择

  # 必须返回真实 IP 的过滤白名单（避免内网与时间服务异常）
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.home.arpa'
    - 'localhost'
    - 'time.*.com'
    - 'time.*.gov'
    - '+.pool.ntp.org'
    - 'time.windows.com'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - 'msftconnecttest.com'
    - '+.stun.*'
    - '+.turn.*'

hosts:
  localhost: 127.0.0.1

proxies: []
proxy-groups: []
rules: []

# ============================================================
# 域名嗅探器
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
