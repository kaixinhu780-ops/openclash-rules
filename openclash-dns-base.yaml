# 可选 subconverter DNS/嗅探基础配置，搭配 INI 生成的“👆 手动选择”组。
mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - localhost
  - time.*.com
  - time.*.gov
  - +.pool.ntp.org
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  nameserver:
  - https://1.1.1.1/dns-query#👆 手动选择
  - https://8.8.8.8/dns-query#👆 手动选择
hosts:
  localhost: 127.0.0.1
proxies: []
proxy-groups: []
rules: []
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
