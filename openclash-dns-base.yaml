# OpenClash DNS 底稿 | 2026-10-15 严格查询模式
# 普通查询和 DIRECT 出口域名解析均通过“👆 手动选择”访问海外 DoH。
# 仅代理节点域名及 DNS 引导使用直连 IP 形式的加密 DoH，防止代理建立前循环依赖。
# 不使用 system、明文 DNS、国内域名查询策略或未配置 fallback 的过滤器。
# 代价：国内 CDN 调度可能变慢；并不代替路由器 DNS 接管和出口抓包验证。
# 此文件是 subconverter 的基础模板，需与 INI 生成的代理组一起使用。
mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: false
  use-hosts: true
  use-system-hosts: false
  default-nameserver: &id001
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  proxy-server-nameserver: *id001
  direct-nameserver: &id002
  - https://1.1.1.1/dns-query#👆 手动选择
  - https://8.8.8.8/dns-query#👆 手动选择
  direct-nameserver-follow-policy: false
  nameserver: *id002
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - localhost
  - time.*.com
  - time.*.gov
  - +.pool.ntp.org
  - time.windows.com
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - msftconnecttest.com
  - +.stun.*
  - +.turn.*
  prefer-h3: false
hosts:
  localhost: 127.0.0.1
proxies: []
proxy-groups: []
rules: []
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
