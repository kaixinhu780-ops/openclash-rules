# Clash Verge / Clash Verge Rev 分流规则模板 (Mihomo / Meta 内核)
# 适用场景：
# 1. Clash Verge / Clash Verge Rev 的「订阅扩展配置 (Merge)」
# 2. 作为独立的 Clash 配置文件使用

# ============================================================
# 1. 策略组定义 (Proxy Groups)
# 顺序已优化：手动/自动置顶，香港节点手动选择，广告拦截移至漏网之鱼后
# ============================================================
proxy-groups:
  # 顶层手动选择组（过滤过期、剩余流量等无效节点）
  - name: 👆 手动选择
    type: select
    include-all: true
    filter: "(?i)^(?!.*(剩余|到期|套餐|流量|官网|更新|订阅|Traffic|Expire)).*$"

  # 顶层自动测速组
  - name: ⚡ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)^(?!.*(剩余|到期|套餐|流量|官网|更新|订阅|Traffic|Expire)).*$"

  # 常用 AI 策略组
