[custom]
; OpenClash 在线订阅转换模板 | 2026-10-14
; 用于 subconverter /sub 的 config 参数，或 OpenClash 的“自定义模板地址”。
; 原始节点订阅填写在 OpenClash 订阅地址栏，不要写进本文件。
; 后端 max_allowed_rulesets 须为 0（不限）或至少 429；上限 64 的后端不能加载完整模板。
; DNS 在 OpenClash 覆写设置中配置；本 INI 不直接设置路由器 DNS。
; 已配置同仓库 DNS/嗅探底稿直链；如改用 OpenClash 自定义覆写，可注释下一行。
clash_rule_base=https://raw.githubusercontent.com/kaixinhu780-ops/openclash-rules/main/openclash-dns-base.yaml

enable_rule_generator=true
overwrite_original_rules=true

; 一、策略组：业务组只显示手动、自动和地区组。
