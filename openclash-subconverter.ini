==============================================================================
文件 2: openclash-dns-base.yaml
==============================================================================

# 可选 subconverter DNS/嗅探基础配置，搭配 INI 生成的"👆 手动选择"组。
mixed-port: 7890
redir-port: 7892
tproxy-port: 7895
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.home.arpa
  - localhost
  - time.*.com
  - time.*.gov
  - +.pool.ntp.org
  use-hosts: true
  use-system-hosts: false
  respect-rules: true
  default-nameserver:
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  nameserver:
  - https://1.1.1.1/dns-query#👆 手动选择
  - https://8.8.8.8/dns-query#👆 手动选择
hosts:
  localhost: 127.0.0.1
proxies: []
proxy-groups: []
rules: []
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443

==============================================================================
修复说明
==============================================================================

问题 1：openclash-subconverter.ini
- 原因：每条规则后面都有错误的 REJECT 重复项，导致所有流量被拒绝
- 修复：删除了所有重复的 REJECT 规则

问题 2：openclash-dns-base.yaml
- 原因：find-process-mode 的值 "off" 是无效的
- 修复：改为 "strict"（有效值：strict / always / false）

==============================================================================
如何使用
==============================================================================

方式 1：本地克隆仓库（需要开启代理/VPN）
```bash
git clone https://github.com/kaixinhu780-ops/openclash-rules.git
cd openclash-rules
# 复制上面两个文件的内容，分别替换对应文件
git add .
git commit -m "修复配置错误"
git push origin main
```

方式 2：GitHub 网页编辑（推荐，最简单）
1. 开启代理/VPN
2. 访问 https://github.com/kaixinhu780-ops/openclash-rules
3. 点击对应文件，点击右上角 ✏️ 编辑
4. 复制上面对应的完整内容，粘贴替换
5. 点击 "Commit changes"

方式 3：使用 GitHub Desktop 或其他 Git 客户端
如果你安装了 GitHub Desktop，用它克隆、编辑、推送会更简单。
