[custom]
; ==========================================================
; 修订版（2026-09-27）
; 1. 删除全部无效的 []GEOIP,<应用名> 行（geoip 只认国家/地区代码，
;    应用名条目不存在，原写法静默失效；域名由对应 GEOSITE 行覆盖）
; 2. category-game-platforms-download（名字不存在）→ category-games
; 3. category-games@cn 为 meta-rules-dat 专属语法，Loyalsoldier dat 无此条目，
;    默认源下失效 → 并入 category-games（如换用 meta-rules-dat 可改回 @cn）
; 4. url-test 参数 300,,50 → 300,300（容差 300ms，间隔 300s）
; 5. 测速 URL 统一 https://www.gstatic.com/generate_204
; 6. 🧭 手动选择 → 🧭 全部节点（避免与 🚀 手动选择 混淆），引用同步
; 7. exclude 去掉重复的 Expire；漏网之鱼去掉冗余的 🧭 全部节点
; 8. 注：🧊 冷门节点 仍按节点名关键词负向匹配，机场节点名不含
;    地区词时可能混入五大区节点，如介意可改用 url-test 自动选择
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗：剔除机场展示/说明/防失联/流量提示节点
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website


; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
; ==========================================================
; Siri Intelligence extension | 2026-10-15
; Upstream: https://github.com/usbog232/clashmetadingyue
; Upstream commit: dc4ce21d9a69e275d1fa06e70501ff69be56c950
; Explicit Siri rules MUST precede China/direct/CDN/Apple/Cloudflare generic rules.
; DNS/network takeover remains configured in OpenClash; this INI is routing only.
; ==========================================================
; Apple: Siri and dictation
ruleset=🍎 Siri Intelligence,[]DOMAIN,guzzoni.apple.com
; Apple: Siri and Spotlight/search
ruleset=🍎 Siri Intelligence,[]DOMAIN-SUFFIX,smoot.apple.com
; Apple: Private Cloud Compute
ruleset=🍎 Siri Intelligence,[]DOMAIN,apple-relay.cloudflare.com
; Apple: Private Cloud Compute
ruleset=🍎 Siri Intelligence,[]DOMAIN,apple-relay.fastly-edge.com
; Apple: Private Cloud Compute
ruleset=🍎 Siri Intelligence,[]DOMAIN,cp4.cloudflare.com
; Apple: Intelligence extensions / ChatGPT handoff
ruleset=🍎 Siri Intelligence,[]DOMAIN,apple-relay.apple.com
; Community: Apple Relay
ruleset=🍎 Siri Intelligence,[]DOMAIN,apple-relay.mask.apple-dns.net
; Community: network region detection (shared geo service)
ruleset=🍎 Siri Intelligence,[]DOMAIN,gspe1-ssl.ls.apple.com
; Community: Siri host family (including probe/seed)
ruleset=🍎 Siri Intelligence,[]DOMAIN-SUFFIX,siri.apple.com
; Community: Siri alias
ruleset=🍎 Siri Intelligence,[]DOMAIN,guzzoni-apple-com.v.aaplimg.com
; Community observation: Apple Relay candidate; verify in logs
ruleset=🍎 Siri Intelligence,[]DOMAIN,apple-relay.akamaized.net
; Optional shared compatibility endpoints (disabled; enable only with matching failure logs).
; Enabling gateway.icloud.com also affects CloudKit/Voice Control, not only Siri.
;ruleset=🍎 Siri Intelligence,[]DOMAIN,gateway.icloud.com
; App Store assets are shared by many apps.
;ruleset=🍎 Siri Intelligence,[]DOMAIN,apps.mzstatic.com

; ==========================================================
; Muse AI: known Muse / Meta AI + shared Meta paths, before any direct/generic rule.
; Shared Facebook/Instagram/WhatsApp traffic matching these rules follows Muse.
; A paired REJECT prevents unsupported UDP from falling through to a later DIRECT rule.
; ==========================================================
ruleset=🧩 Muse AI,[]DOMAIN-SUFFIX,muse.ai
ruleset=REJECT,[]DOMAIN-SUFFIX,muse.ai
ruleset=🧩 Muse AI,[]DOMAIN-SUFFIX,meta.ai
ruleset=REJECT,[]DOMAIN-SUFFIX,meta.ai
ruleset=🧩 Muse AI,[]DOMAIN-SUFFIX,metaaivm.com
ruleset=REJECT,[]DOMAIN-SUFFIX,metaaivm.com
ruleset=🧩 Muse AI,[]DOMAIN,auth.meta.com
ruleset=REJECT,[]DOMAIN,auth.meta.com
ruleset=🧩 Muse AI,[]GEOSITE,meta
ruleset=REJECT,[]GEOSITE,meta
; Muse 域名快照固定在历史提交；清理仓库后仍可拉取。
ruleset=🧩 Muse AI,clash-classic:https://raw.githubusercontent.com/kaixinhu780-ops/openclash-rules/b205160f6046e5079e6ac8dbebbeedefcf5640e3/rules/MuseMeta.yaml
ruleset=REJECT,clash-classic:https://raw.githubusercontent.com/kaixinhu780-ops/openclash-rules/b205160f6046e5079e6ac8dbebbeedefcf5640e3/rules/MuseMeta.yaml
ruleset=🧩 Muse AI,[]DOMAIN,production.museai.com
ruleset=REJECT,[]DOMAIN,production.museai.com

ruleset=🟥 Adobe,[]GEOSITE,adobe
; --- 动画疯 / Apple TV：优先于通用直连与 Apple 规则 ---
; 仅匹配动画疯站点与专用 CDN，避免将公共证书/CDN 域名全部导向台湾。
ruleset=📺 动画疯,[]DOMAIN,bahamut.akamaized.net
ruleset=📺 动画疯,[]DOMAIN-SUFFIX,bahamut.com.tw
ruleset=📺 动画疯,[]DOMAIN-SUFFIX,gamer.com.tw
; Apple TV 域名参考 blackmatrix7/ios_rule_script 的 AppleTV.list。
ruleset=🍎 Apple TV,[]DOMAIN,hls-amt.itunes.apple.com
ruleset=🍎 Apple TV,[]DOMAIN,hls.itunes.apple.com
ruleset=🍎 Apple TV,[]DOMAIN,np-edge.itunes.apple.com
ruleset=🍎 Apple TV,[]DOMAIN,play-edge.itunes.apple.com
ruleset=🍎 Apple TV,[]DOMAIN,tv.applemusic.com
ruleset=🍎 Apple TV,[]DOMAIN,uts-api.itunes.apple.com
ruleset=🍎 Apple TV,[]DOMAIN-SUFFIX,tv.apple.com

; --- 私网直连 ---
